[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbalance-poc"
version = "0.1.0"
description = "Backbone-first multi-agent research with learned adaptive DAGs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["torch>=2.6", "sentence-transformers>=3.0"]
routerbench = ["pandas>=2.2", "pyarrow>=14"]

[project.scripts]
agentbalance = "agentbalance.cli:main"

[tool.setuptools.packages.find]
include = ["agentbalance*"]

[tool.setuptools.package-data]
agentbalance = ["demo.json"]
